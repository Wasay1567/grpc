syntax = "proto3";

package inventory;

option go_package = "proto/inventory";

service InventoryService {
    rpc CheckStore (StockRequest) returns (StockResponse);
    rpc DecreaseStock (StockRequest) returns (StockResponse);
}

message StockRequest {
    string item_id = 1;
    int32 quantity = 2;
}

message StockResponse {
    bool available =1;
    string message = 2;
}
